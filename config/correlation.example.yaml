# =============================================================================
# Corrélation couple transmissions instrumentées (Manner PCM16) / banc GMP
# Chapitre 10 du rapport AMDEC
# =============================================================================
#
# MODE D'EMPLOI
#   1. Copier ce fichier en `config/correlation.yaml`.
#   2. Renseigner `racine_donnees` : UN dossier contenant les acquisitions
#      (.mf4, .mdf, .aif). Aucun classement par type d'essai n'est demandé ;
#      les sous-dossiers, s'il y en a, sont parcourus comme le reste.
#   3. Lancer `python scripts/01_inventaire.py --racine "<racine>"`.
#   4. Recopier ici la section `canaux:` produite dans
#      `sortie/inventaire/canaux_proposition.yaml`, APRÈS avoir vérifié chaque
#      libellé dans `sortie/inventaire/inventaire_canaux.md`.
#   5. Lancer `python scripts/02_analyse.py`.
#
# MODE AUTOMATIQUE (celui de ce fichier)
#   Sans bloc `essais:`, l'outil n'attend AUCUNE déclaration de type. Chaque
#   acquisition est examinée pour ce qu'elle contient réellement, et chaque
#   grandeur est calculée à partir des zones qui la concernent, tous fichiers
#   confondus :
#     paliers stabilisés                    → régression, offset, sensibilité,
#                                              non-linéarité
#     montée ET descente dans un fichier    → hystérésis
#     même niveau atteint par ≥ 2 fichiers  → répétabilité
#     plage d'activité dynamique continue   → recalage temporel
#     repos en début ET en fin de fichier   → dérive de zéro
#   Un fichier alimente autant de grandeurs qu'il contient de zones : rien
#   n'oblige un essai à n'avoir qu'un seul usage.
#
#   Le bloc `essais:` reste accepté (voir plus bas) pour figer soi-même le
#   traitement de chaque dossier ; il bascule alors l'outil en mode déclaré.
#
# Tout ce qui est marqué « À RENSEIGNER » ou « À CONFIRMER » doit être tranché
# par l'exploitant : le pipeline ne devine aucune de ces valeurs, et déclarera
# explicitement « non calculable » toute grandeur qui en dépend.
# =============================================================================

# --- Données et sortie -------------------------------------------------------
racine_donnees: "C:/user/SD17365/Documents"   # À RENSEIGNER (chemin exact)
dossier_sortie: "sortie"

# --- Caractéristiques de la chaîne de mesure ---------------------------------
pleine_echelle_Nm: 1500.0   # PE du capteur : toutes les grandeurs en « % PE » s'y rapportent

comparaison:
  # Voie de couple mesuré confrontée à la référence banc :
  #   gauche | droite | moyenne | somme
  # « moyenne » est cohérent avec une référence prise au même point de la
  # chaîne (rapport 1:1) sur un essai en ligne droite ; « somme » convient si
  # la référence représente le couple total aux roues.
  mode: "moyenne"

  # Facteur appliqué au couple de RÉFÉRENCE pour le ramener au point de mesure
  # des transmissions. 1.0 = référence prise au même point (cas de cette campagne).
  rapport_reduction: 1.0

  # Incertitude-type (k=1) du moyen de référence banc, en N·m.
  #
  # SAISIE UTILISATEUR, par construction. Cette valeur caractérise le banc, pas
  # les acquisitions : aucun traitement du signal ne peut la produire, et le
  # pipeline ne tentera jamais de l'estimer. Elle se lit sur le certificat
  # d'étalonnage du banc GMP (ou dans son dossier de raccordement métrologique).
  #
  # Laissée à `null`, la contribution est simplement exclue du bilan, qui est
  # alors explicitement annoncé comme un MINORANT, avec la liste des exclusions.
  # Le rapport reste donc juste — seulement moins complet.
  #
  # Attention à l'unité et au facteur : c'est une incertitude-TYPE (k=1). Si le
  # certificat donne une incertitude élargie U à k=2, saisir U/2.
  incertitude_reference_k1_Nm: null

# --- Symétrie de chargement --------------------------------------------------
# `true` UNIQUEMENT si les deux transmissions voient le même couple par
# construction — c'est la condition pour que le résidu gauche − droite soit un
# indicateur métrologique (redondance indépendante du banc) et non un écart
# physique réel. Sur banc GMP, cela revient à : les deux sorties sont-elles
# chargées symétriquement ? Ici oui sur toute la campagne.
#
# À repasser à `false` si un essai sollicite volontairement le différentiel
# (sol dissymétrique, différentiel piloté) ou s'accompagne de patinage avec
# intervention de l'antipatinage d'un seul côté : l'indicateur de redondance
# est alors simplement déclaré non calculable, plutôt que faux.
ligne_droite: true

# --- Démontage / remontage de la chaîne de mesure ----------------------------
# `realise: false` déclare qu'AUCUN démontage/remontage n'a eu lieu au cours de
# la campagne. La « répétabilité après remontage » reste alors non calculable,
# mais le rapport le motive correctement : la grandeur n'est pas DÉFINIE ici,
# elle n'a pas été oubliée en configuration. La nuance compte dans un rapport
# relu par des tiers.
# Mettre `true` (et renseigner deux `groupe_remontage` distincts) le jour où une
# dépose/repose est intercalée entre deux séries de points stabilisés.
remontage:
  realise: false

# --- Acquisition -------------------------------------------------------------
acquisition:
  # Fréquence de la grille de temps commune sur laquelle tous les canaux sont
  # rééchantillonnés. À choisir ≥ à la cadence du canal le plus rapide utilisé
  # (visible dans le rapport d'inventaire) pour ne pas perdre d'information ;
  # une valeur trop élevée ne fait que gonfler le temps de calcul.
  frequence_reechantillonnage_Hz: 100

# --- Mapping des canaux ------------------------------------------------------
# `defaut` s'applique à tous les essais ; `par_dossier` surcharge clé par clé.
# `null` = canal absent de l'acquisition (les grandeurs qui en dépendent seront
# déclarées non calculables, jamais estimées).
canaux:
  defaut:
    couple_mesure_gauche: null       # À RENSEIGNER depuis l'inventaire
    couple_mesure_droite: null       # À RENSEIGNER

    # Le banc GMP fournit DEUX voies de référence, une par sortie. Le mode de
    # comparaison ci-dessus s'applique de la même façon aux voies mesurées et
    # aux voies de référence : en « moyenne », (G+D)/2 mesuré est confronté à
    # (G+D)/2 de référence.
    couple_reference_gauche: null    # À RENSEIGNER
    couple_reference_droite: null    # À RENSEIGNER
    # Repli, uniquement si le banc ne fournit qu'une seule voie de référence.
    # Ignoré dès que les deux voies ci-dessus sont renseignées.
    couple_reference: null

    regime: null                     # À RENSEIGNER
    temperature: null                # À RENSEIGNER (arbre, capteur ou électronique rotor)
    etat: []                         # canaux LED / CRC / erreurs, si présents

  par_dossier:
    # Les libellés étant identiques sur toute la campagne, tout est déclaré une
    # seule fois dans `defaut` ci-dessus et ce bloc reste vide.
    # Ne renseigner ici que les dossiers dont les noms de canaux diffèrent.
    {}

# --- Déclaration des essais (FACULTATIF) -------------------------------------
# Laisser ce bloc ABSENT — c'est le cas par défaut — pour le mode automatique :
# les zones sont découvertes fichier par fichier (cf. « MODE D'EMPLOI » en tête).
#
# Le renseigner bascule l'outil en mode déclaré : chaque sous-dossier reçoit un
# type imposé, et seul le traitement correspondant lui est appliqué. Utile pour
# figer une exploitation qu'on veut reproduire à l'identique, ou pour écarter
# volontairement une partie d'une acquisition.
#
#   type :
#     balayage      → régression, offset, sensibilité, non-linéarité, hystérésis
#     repetabilite  → dispersion à couple de référence constant
#     dynamique     → recalage temporel par intercorrélation
#
#   ligne_droite : même signification que le drapeau global ci-dessus, mais
#     déclaré essai par essai.
#
#   groupe_remontage : étiquette libre ("avant" / "apres" ...). Il en faut au
#     moins DEUX distinctes dans la campagne pour que la « répétabilité après
#     remontage » soit calculable. Aucun remontage n'ayant été réalisé sur cette
#     campagne (cf. `remontage.realise`), la grandeur reste non calculable :
#     c'est une décision actée, pas un oubli de configuration.
#
# essais:
#   "1-Balayage Couple":
#     type: "balayage"
#     ligne_droite: true
#     groupe_remontage: null
#   "7-WLTC":
#     type: "dynamique"
#     ligne_droite: true

# =============================================================================
# HYPOTHÈSES DE TRAITEMENT
# Ces valeurs sont reprises telles quelles dans le § « Hypothèses » du rapport.
#
# En mode automatique, ce sont ELLES qui décident de ce que chaque acquisition
# alimente : un fichier n'apporte des paliers que si ses plages stabilisées
# satisfont les critères ci-dessous, et n'apporte un retard que si son activité
# dynamique satisfait ceux de la section `intercorrelation`. Si une acquisition
# n'alimente pas ce qu'on en attendait, c'est ici que ça se règle — jamais en
# forçant un résultat.
# =============================================================================

# --- Détection des paliers stabilisés ---------------------------------------
paliers:
  duree_palier_s: 2.0                  # durée minimale d'une plage stabilisée
  tolerance_stab_pc_pe: 0.5            # écart-type max du couple de référence dans la fenêtre
  fraction_finale: 0.5                 # part finale du palier effectivement moyennée
  ecart_min_paliers_pc_pe: 1.0         # écart minimal entre deux paliers distincts
  tolerance_appariement_pc_pe: 1.0     # appariement montée/descente et regroupement des répétitions

# --- Recalage temporel par intercorrélation ---------------------------------
intercorrelation:
  retard_max_ms: 500.0                 # bornes de recherche du retard
  # Coupure du passe-haut appliqué avant corrélation. Sans lui, l'offset et les
  # composantes lentes dominent le produit de corrélation et aplatissent le pic.
  # La coupure est automatiquement RELEVÉE si la fenêtre retenue est courte, de
  # façon à y loger au moins cinq périodes : un Butterworth à 0,2 Hz met
  # plusieurs secondes à s'établir, et sur une fenêtre de dix secondes — le cas
  # d'un départ arrêté — son régime transitoire déplacerait le pic de plusieurs
  # dizaines de millisecondes. La coupure réellement appliquée est indiquée
  # dans le § détail du rapport, essai par essai.
  passe_haut_Hz: 0.2                   # null pour désactiver le filtrage préalable
  seuil_activite_pc_pe: 2.0            # écart-type mini du couple de référence pour juger « dynamique »
  fenetre_activite_s: 1.0
  # Un cycle passe par des extrema où la variance instantanée s'annule : sans
  # ce comblement, la plage dynamique se fragmenterait en morceaux trop courts.
  # Toute interruption d'activité plus brève que cette durée est ignorée.
  duree_comblement_s: 5.0

  # Contrôle de cohérence du retard. Le retard est ré-estimé sur autant de
  # sous-fenêtres égales, et l'étendue de ces estimations est confrontée au
  # seuil ci-dessous. Au-delà, le retard est annoncé « faiblement identifié » :
  # il ne tient qu'à une partie du signal.
  #
  # C'est le cas d'un départ arrêté, où seul le front porte l'information de
  # synchronisation — la décroissance qui suit n'en porte aucune. La valeur
  # reste le meilleur point de la corrélation, mais elle est moins bien assise
  # qu'un retard tiré d'un cycle à variations continues, et le rapport le dit.
  n_blocs_coherence: 4
  accord_blocs_max_ms: 20.0

  # TOUTES les plages dynamiques d'un fichier sont corrélées, et le retard
  # retenu est la MÉDIANE des retards par fenêtre : un relevé de quatre départs
  # arrêtés porte quatre mesures du même retard, et l'écart entre elles est une
  # reproductibilité réelle, bien plus parlante qu'un découpage artificiel.
  #
  # Sont écartées les fenêtres dont le score `amplitude × √durée` tombe sous
  # cette fraction de la meilleure : sur un relevé long, une portion de bruit
  # franchit le seuil d'activité sans rien apprendre du retard.
  fraction_score_min: 0.25

  # Durée minimale d'une fenêtre pour être corrélée. `null` applique la règle
  # par défaut : dix fois `retard_max_ms`, avec un plancher de 2 s.
  #
  # ⚠️ VERROU À CONNAÎTRE SUR LES DÉPARTS ARRÊTÉS. Avec 500 ms de retard
  # maximal, il exige 5 s ; or un front de départ arrêté n'est « actif » que
  # deux à quatre secondes. Les fronts sont alors tous écartés, et le retard
  # finit par se lire sur une portion plus longue mais bien moins informative.
  # Sur une campagne de DA, l'abaisser — ou réduire `retard_max_ms`, qui le
  # pilote — est le premier réglage à revoir. La figure des zones montre
  # immédiatement si les fronts sont devenus des fenêtres.
  duree_min_fenetre_s: null

# --- Relevés de zéro --------------------------------------------------------
zero:
  duree_fenetre_s: 5.0
  seuil_couple_ref_pc_pe: 1.0
  seuil_regime: 20.0                   # unité du canal régime ; null pour ignorer ce critère
  fraction_bord: 0.25                  # le zéro « début » doit tomber dans les 25 % initiaux

# --- Sensibilité thermique --------------------------------------------------
thermique:
  amplitude_min_C: 5.0                 # en deçà, la pente est jugée non identifiable
  # Plage de température rencontrée EN SERVICE, utilisée uniquement pour convertir
  # la sensibilité thermique en contribution au bilan d'incertitude.
  #
  # SAISIE UTILISATEUR : c'est un choix de domaine d'emploi, pas une grandeur
  # mesurable. L'excursion thermique constatée sur les essais ne peut pas en
  # tenir lieu — elle décrit la campagne, pas les conditions de service.
  # null → contribution exclue et incertitude annoncée comme minorant.
  plage_service_C: null

# --- Seuils de rédaction de la conclusion qualitative -----------------------
# Ces seuils ne servent qu'à choisir la formulation (offset / gain /
# synchronisation / écart de modèle) ; ils n'entrent dans aucun calcul.
diagnostic:
  seuil_offset_pc_pe: 0.5
  seuil_gain_pc: 1.0
  seuil_retard_ms: 5.0
  gain_rms_recalage: 0.30
  seuil_correlation_point_fct: 0.5
